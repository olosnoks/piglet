; PlatformIO build for the official Piglet firmware (this sketch folder).
; Matches the Arduino IDE release build: XIAO_ESP32C5, 80 MHz CPU, USB CDC on boot,
; QIO 80 MHz flash, 8 MB, huge_app partitions (3 MB app at 0x10000).
;
;   pio run                 build
;   pio run -t upload       build and flash (port is auto-detected; set upload_port to pin it)
;   pio device monitor      serial log
;
; The Arduino IDE ignores this file and the .pio folder it creates.

[platformio]
src_dir = .

[env:xiao_c5]
; Pinned to 55.03.39 (Arduino-ESP32 3.3.9): "stable" ships libs with paths >260 chars,
; which fail to unpack on Windows unless long paths are enabled.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = arduino

board_build.f_cpu = 80000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Arduino IDE build output lives in build/; don't compile anything from it
build_src_filter = +<*> -<build/> -<.pio/>

; Local pre-build fixes (see pio_build_fixes.py):
;  - re-adds the FatFS include this platform package drops (SD needs ff.h)
;  - makes the .ino->.cpp conversion work from a path containing spaces
extra_scripts = pre:pio_build_fixes.py

monitor_speed = 115200
upload_speed = 921600
;upload_port = COM15

; The ESP32-C5's USB-Serial/JTAG re-enumerates when esptool loads its flasher
; "stub", which drops the connection ("Failed to start stub flasher"). Flashing
; without the stub writes straight through the ROM loader and avoids that, so
; no BOOT button press is needed. PlatformIO prepends this before "write-flash".
upload_flags = --no-stub

lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    mikalhart/TinyGPSPlus
    bblanchon/ArduinoJson
